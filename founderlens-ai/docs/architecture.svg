<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="350" viewBox="0 0 1280 350" role="img" aria-labelledby="title desc"><title id="title">FounderLens AI architecture</title><desc id="desc">Founder input leads to a source ledger, open-weight on-device model, human review, and local export.</desc><rect width="1280" height="350" fill="#101827"/><style>text{fill:#f2fbff;font-family:Arial,sans-serif;font-size:17px}.sm{font-size:12px;fill:#b2cadc}.b{fill:#20394c;stroke:#8fc5d9;stroke-width:2}.h{fill:#2c3154;stroke:#c5b3ff;stroke-width:3}.a{fill:none;stroke:#8fe5d2;stroke-width:4}</style><text x="45" y="60" style="font-size:32px;font-weight:700">FounderLens AI — Agent and human trust boundary</text><text x="45" y="90" class="sm">Zero paid inference credits · no application backend · no autonomous external actions</text><rect x="35" y="135" width="196" height="100" rx="15" class="b"/><text x="51" y="173">Founder hypothesis</text><text x="51" y="197" class="sm">+ supplied excerpts</text><path d="M235 184h36" class="a"/><rect x="274" y="135" width="200" height="100" rx="15" class="b"/><text x="290" y="172">Source ledger</text><text x="290" y="197" class="sm">Input IDs, unverified</text><path d="M476 184h37" class="a"/><rect x="517" y="135" width="219" height="100" rx="15" class="b"/><text x="533" y="172">SmolLM2 local AI</text><text x="533" y="197" class="sm">ONNX + Transformers.js</text><path d="M740 184h38" class="a"/><rect x="781" y="123" width="210" height="125" rx="15" class="h"/><text x="798" y="163">Human checkpoint</text><text x="798" y="189" class="sm">Approve / revise / reject</text><text x="798" y="211" class="sm">Explain rationale</text><path d="M994 184h38" class="a"/><rect x="1037" y="135" width="207" height="100" rx="15" class="b"/><text x="1053" y="172">Local report</text><text x="1053" y="197" class="sm">Markdown download</text><text x="45" y="296" class="sm">Model/runtime weights are fetched from Hugging Face and jsDelivr; those providers may observe request metadata.</text></svg>