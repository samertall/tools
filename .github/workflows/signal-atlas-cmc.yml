name: Signal Atlas CI & Live API Proof
on:
  push:
    paths:
      - 'cmc-signal-atlas/**'
      - '.github/workflows/signal-atlas-cmc.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: cmc-signal-atlas
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax + unit + contract tests
        run: npm run check
      - name: Capture actual CMC HTTP responses and deployed API
        env:
          SIGNAL_ATLAS_URL: https://signal-atlas-cmc-2026.vercel.app
        run: python3 scripts/capture_live_evidence.py
      - name: Upload sanitized audit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-atlas-real-api-evidence
          path: cmc-signal-atlas/evidence/live-response.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish confirmed evidence in public repository
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/live-response.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence(cmc): verified live HTTP responses [skip ci]"
            git push origin HEAD:main
          fi
