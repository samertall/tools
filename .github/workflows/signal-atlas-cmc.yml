name: Signal Atlas CI & Live API Proof
on:
  push:
    paths:
      - 'cmc-signal-atlas/**'
      - '.github/workflows/signal-atlas-cmc.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: cmc-signal-atlas
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax + unit + contract tests
        run: npm run check
      - name: Launch actual application on CI runner
        run: |
          nohup node dev-server.js > /tmp/signal-atlas-app.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then
              echo "Local application ready"; break
            fi
            sleep 1
          done
      - name: Capture actual CMC HTTP responses and verified live application
        env:
          SIGNAL_ATLAS_URL: http://127.0.0.1:3000
        run: |
          python3 scripts/capture_live_evidence.py
          echo "--- Local app log (no secret headers) ---"
          tail -n 20 /tmp/signal-atlas-app.log
      - name: Install browser automation tools
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Capture true live-market application browser demo
        id: demo
        continue-on-error: true
        env:
          SIGNAL_ATLAS_URL: http://127.0.0.1:3000
        run: |
          node scripts/capture_demo.mjs
          ffmpeg -hide_banner -loglevel error -y -i demo/signal-atlas-live-demo.webm -c:v libx264 -preset fast -crf 29 -pix_fmt yuv420p -movflags +faststart demo/signal-atlas-live-demo.mp4
      - name: Upload true live-market video and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-atlas-real-browser-demo
          path: |
            cmc-signal-atlas/demo/*.mp4
            cmc-signal-atlas/demo/*.png
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload sanitized audit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-atlas-real-api-evidence
          path: cmc-signal-atlas/evidence/live-response.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish confirmed evidence in public repository
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/live-response.json
          if [ -f demo/signal-atlas-live-demo.mp4 ]; then
            git add demo/signal-atlas-live-demo.mp4 demo/screenshot-live-overview.png demo/screenshot-api-evidence.png
          fi
          if ! git diff --cached --quiet; then
            git commit -m "evidence(cmc): verified live HTTP responses [skip ci]"
            git push origin HEAD:main
          fi
